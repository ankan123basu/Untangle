# nginx config for the Untangle SPA container.
# - Serves the built React app with an SPA fallback (unknown paths -> index.html).
# - Proxies /api/ to the backend so the browser only ever talks to one origin (no CORS needed).
# - Adds security headers and long-lived caching for hashed assets.

# Docker's embedded DNS, so the "backend" hostname is re-resolved if the container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the caller's X-Request-Id if it sent one, otherwise generate one. The backend validates the
# format, puts it in every log line and echoes it back, so one id traces a request end to end.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Security headers (Section 6.3). `always` adds them to error responses too. ----
    # style-src needs 'unsafe-inline' because Motion/React Bits set inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Container healthcheck target. Not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- API reverse proxy ----
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $correlation_id;
        # Server-Sent Events (notifications stream, Phase 5) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ---- Hashed build assets: cache for a year, they never change. ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- SPA fallback: index.html must never be cached, so new deploys are picked up. ----
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
