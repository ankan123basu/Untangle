# Profile used by automated tests (activated with @ActiveProfiles("test")).

logging:
  level:
    root: WARN
    dev.untangle: INFO
    # The concurrency tests provoke unique-constraint violations on purpose; Hibernate logs each at
    # WARN. Keep CI output readable; real failures still fail the assertions.
    org.hibernate.orm.jdbc.error: ERROR

app:
  security:
    jwt:
      # TEST ONLY. Not used anywhere else.
      secret: aczAz91ytoLrhfflpq3hMxjO30WXJzHRBnoVLd9WIqSkjC+oug/fX5eeg/96hfJw
    # Cost 4 keeps the suite fast; production uses 12. Hashes embed their cost, so both verify.
    bcrypt-strength: 4
    rate-limits:
      # Generous per-IP limit: every MockMvc request comes from 127.0.0.1.
      login-per-ip:
        capacity: 1000
        period: 1m
      login-per-email:
        capacity: 10
        period: 1m
  crypto:
    # TEST ONLY key.
    secret-encryption-key: 4sd44g6TiKqWnkLmvhjwtHSdJyONsUhN9CpzafQV+rw=
  webhook:
    per-ip-limit:
      capacity: 100000
      period: 1m
  escalation:
    # Tests call SlaBreachProcessor directly; no background scheduler racing the assertions.
    scheduler-enabled: false
