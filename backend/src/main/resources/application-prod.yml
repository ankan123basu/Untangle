# Production-like profile (used by Docker Compose). Secure defaults only.

management:
  # Actuator (incl. /actuator/prometheus) on its own port, which Compose never publishes: only
  # Prometheus on the internal network can scrape it. /livez and /readyz stay on 8080.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
  structured:
    format:
      # One JSON object per line (Logstash format, built into Spring Boot). Includes MDC fields
      # such as requestId, so logs can be searched by the X-Request-Id a user reports.
      console: logstash
