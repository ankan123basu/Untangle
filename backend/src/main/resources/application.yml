# Base configuration shared by every profile.
# Profile files (application-<profile>.yml) only override what differs.
# Every value that changes between environments comes from an environment variable;
# see the root .env.example for the full list.

spring:
  application:
    name: untangle
  profiles:
    # Local development is the default; Docker Compose and CI set SPRING_PROFILES_ACTIVE explicitly.
    default: dev
    group:
      # `dev` always brings demo data. Production never does unless `demo` is added on purpose.
      dev: demo

  datasource:
    # Local default = the Docker Compose Postgres published on host port 5433.
    # Docker/CI override all three via SPRING_DATASOURCE_* environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/untangle}
    username: ${SPRING_DATASOURCE_USERNAME:untangle}
    password: ${SPRING_DATASOURCE_PASSWORD:untangle-local-dev-only}
    hikari:
      pool-name: untangle-db
      # Small pool on purpose: Postgres performs best with few busy connections, and virtual
      # threads queue cheaply for one. Tune with load tests (Phase 10), not by guessing.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      # Hikari's own properties are plain milliseconds (not Spring Duration strings like "5s").
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    # Never keep a DB session open while rendering the HTTP response: lazy loading must happen
    # inside service transactions, where it is visible and testable (no hidden N+1 in controllers).
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-003). Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Loads lazy collections/associations in batches instead of one query per row.
        default_batch_fetch_size: 32

  flyway:
    locations: classpath:db/migration
    # The demo seed is a repeatable migration in a separate folder. Switching an existing database
    # from demo to non-demo must not fail validation because that seed "disappeared".
    ignore-migration-patterns: "*:future,repeatable:missing"
  threads:
    virtual:
      # Java 21 virtual threads: each request gets a cheap thread, so blocking I/O (JDBC, HTTP
      # to Groq) does not exhaust the Tomcat thread pool.
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests before the container stops.
  shutdown: graceful
  # Trust X-Forwarded-For/-Proto only from internal proxy addresses (Tomcat RemoteIpValve defaults:
  # 10/8, 172.16/12, 192.168/16, 127/8). Behind nginx this gives the real client IP for rate
  # limiting and audit, while a client can't spoof it by sending the header directly.
  forward-headers-strategy: native
  error:
    # Never leak stack traces or exception messages to clients (Section 6.3).
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # Exposes /actuator/health/liveness and /actuator/health/readiness for Docker/K8s.
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Untangle
    tagline: Every complaint, untangled.

logging:
  # Readable dev logs still show the correlation id of each request.
  pattern:
    level: "%5p [%X{requestId:-}]"

# -----------------------------------------------------------------------------
# Application settings (typed: SecurityProperties, BootstrapAdminProperties)
# -----------------------------------------------------------------------------
app:
  security:
    jwt:
      # REQUIRED. Base64, >= 32 bytes. `make up` generates one into .env. The app refuses to start
      # without it (fail fast).
      secret: ${JWT_SECRET:}
      issuer: untangle
      access-token-ttl: 15m
    refresh:
      ttl: 7d
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
    lockout:
      max-failed-attempts: 5
      duration: 15m
    bcrypt-strength: 12
    # How long a deactivated agent's still-valid JWT may keep working on OTHER instances (R8).
    principal-cache-ttl: 30s
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limits:
      login-per-ip:
        capacity: 20
        period: 1m
      login-per-email:
        capacity: 10
        period: 1m
  crypto:
    # REQUIRED. AES-256 key (base64, exactly 32 bytes) that encrypts partner HMAC secrets at rest.
    # `make .env` generates one. Losing it makes stored partner secrets unrecoverable (rotate them).
    secret-encryption-key: ${APP_SECRET_ENCRYPTION_KEY:}
  webhook:
    max-body-bytes: 65536
    timestamp-tolerance: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}s
    rotation-grace: 24h
    per-ip-limit:
      capacity: 300
      period: 1m
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  tickets:
    # MASTER_PROMPT §6.2: may an AGENT close their own RESOLVED ticket?
    agent-can-close-own-resolved: false
    # §5.4 resolution targets. sla_due_at = SLA clock start + target(priority).
    sla:
      CRITICAL: 1h
      HIGH: 4h
      MEDIUM: 24h
      LOW: 72h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
