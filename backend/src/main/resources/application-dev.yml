# Local development profile (`./mvnw spring-boot:run` or `make backend-run`).
# Friendlier for debugging; never used in production.

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.untangle: DEBUG

app:
  security:
    jwt:
      # DEV ONLY: a fixed key so local restarts keep you logged in. Docker/prod use JWT_SECRET.
      secret: ${JWT_SECRET:WoPT2ZsGMbOLYLB2T/F94g0RqBQlhoXlD2FUzeDp+1KHwAQyK47z084stqCTbYfz}
    refresh:
      # Vite dev server is plain http://localhost:5173; Safari drops Secure cookies on plain HTTP.
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
  crypto:
    # DEV ONLY key. Docker/prod read APP_SECRET_ENCRYPTION_KEY from .env.
    secret-encryption-key: ${APP_SECRET_ENCRYPTION_KEY:CI++ZYKXp4d4oDQWJxDZ2kkNue1ZOnMX5mgOOUhgzoY=}
