# Untangle — local stack.
#
#   make up                         postgres + backend + frontend
#   docker compose --profile redis up -d     ...plus Redis (optional cache / rate limiting)
#
#   make simulate                   partner webhook scenarios (profile `simulator`)
#   docker compose --profile observability up -d   ...plus Prometheus (:9090) + Grafana (:3001)
# All values come from .env (copied from .env.example by `make up` on a fresh clone).

name: untangle

services:
  postgres:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-untangle}
      POSTGRES_USER: ${POSTGRES_USER:-untangle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      # Host 5433 by default, because a local Homebrew Postgres usually owns 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: untangle/backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,demo}
      # Flyway migrates this database on startup, then Hibernate validates the schema.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-untangle}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-untangle}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is empty - run `make .env` on a fresh clone, or set it in .env}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?APP_SECRET_ENCRYPTION_KEY is empty - run `make .env` on a fresh clone, or set it in .env}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      DEMO_PARTNER_SECRET: ${DEMO_PARTNER_SECRET:-acme-demo-secret-change-me}
      AI_ENABLED: ${AI_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      # Only read when SPRING_PROFILES_ACTIVE includes "redis" (start Compose with --profile redis).
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: UTC
    ports:
      # API on 8080. Actuator (incl. /actuator/prometheus) is on 8081 and deliberately NOT published.
      - "${BACKEND_HOST_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 768m

  frontend:
    build:
      context: ./frontend
    image: untangle/frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"

  partner-simulator:
    build:
      context: ./partner-simulator
    image: untangle/partner-simulator:local
    profiles: ["simulator"]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      # Talks to the API through nginx, exactly like an external partner would.
      SIM_BASE_URL: http://frontend:8080
      SIM_ADMIN_EMAIL: ${SIM_ADMIN_EMAIL:-admin@untangle.local}
      SIM_ADMIN_PASSWORD: ${SIM_ADMIN_PASSWORD:-Untangle@2026}

  redis:
    image: redis:8.10.3-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Observability (§16): Prometheus scrapes the backend's internal port 8081; Grafana ships a
  # provisioned "Untangle overview" dashboard. Both are bound to localhost only.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/untangle.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"

volumes:
  postgres-data:
  prometheus-data:
